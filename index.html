<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turkey Crossword Helper</title>
<style>
  :root {
    --bg: #faf6ef; --panel: #fffdf9; --ink: #2b2420; --muted: #8a7d72; --line: #e6dccf;
    --accent: #b5562b; --sure: #2e7d4f; --unsure: #c08a12; --trying: #5b6fb5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  #q { flex: 1 1 260px; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #stats { font-size: 13px; color: var(--muted); flex: 1 1 auto; }
  #who { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  #who b { color: var(--ink); }
  #who button, .tools button { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  #conn.live { background: var(--sure); }
  .bar2 { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  main { display: grid; grid-template-columns: 1fr 1fr 380px; height: calc(100vh - 110px); }
  .col { overflow-y: auto; border-right: 1px solid var(--line); }
  .col h2 { position: sticky; top: 0; background: var(--bg); margin: 0; padding: 8px 14px; font-size: 13px; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); }
  .clue { display: grid; grid-template-columns: 22px 46px 1fr; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #f0e9df; cursor: pointer; align-items: baseline; }
  .clue:hover { background: #f5eee4; }
  .clue.sel { background: #fde9d9; }
  .clue.flash { animation: flash 1.2s; }
  @keyframes flash { from { background: #fff3b0; } to { background: transparent; } }
  .clue .n { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .clue .ans { display: block; font-family: ui-monospace, Menlo, monospace; font-weight: 700; letter-spacing: .08em; color: var(--accent); font-size: 13px; }
  .clue .by { font-family: -apple-system, sans-serif; font-weight: 400; letter-spacing: 0; color: var(--muted); font-size: 11px; margin-left: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; margin-top: 3px; }
  .dot.sure { background: var(--sure); border-color: var(--sure); }
  .dot.unsure { background: var(--unsure); border-color: var(--unsure); }
  .dot.trying { background: var(--trying); border-color: var(--trying); }
  .askline { display: block; font-size: 12px; color: var(--trying); }
  details.ask summary { cursor: pointer; font-size: 12px; color: var(--muted); letter-spacing: .05em; margin: 14px 0 6px; }
  details.ask summary b { color: var(--trying); letter-spacing: 0; }
  .askbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .askbtns button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 14px; }
  .askbtns button.on { background: var(--trying); border-color: var(--trying); color: #fff; }
  #askF { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 9px; font-size: 13px; }
  .len { color: var(--muted); font-size: 12px; margin-left: 4px; white-space: nowrap; }
  .pat { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .25em; color: var(--muted); }
  .boxes { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
  .box { width: 30px; height: 34px; border: 1.5px solid var(--ink); border-radius: 3px; display: flex; align-items: center; justify-content: center;
         font: 700 18px ui-monospace, Menlo, monospace; cursor: pointer; background: #fff; position: relative; }
  .box.mine { color: var(--accent); }
  .box.cross { color: var(--trying); background: #eef1fb; }
  .box.clash { border-color: #c0392b; background: #fde2df; color: #c0392b; }
  .box small { position: absolute; top: 1px; left: 2px; font: 400 8px -apple-system, sans-serif; color: var(--muted); }
  .warn { color: #c0392b; font-size: 12px; margin-top: 4px; }
  .ocr { font-size: 11px; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  #detail { overflow-y: auto; padding: 16px; background: var(--panel); }
  .xbtn { float: right; width: 32px; height: 32px; margin: -6px -6px 0 8px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
  .xbtn:hover { color: var(--ink); border-color: var(--ink); }
  #detail .big { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  #detail .cluetext { font-size: 21px; margin: 4px 0 6px; }
  #detail label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; letter-spacing: .05em; }
  .lastby { font-size: 12px; color: var(--muted); }
  #ans { width: 100%; font: 700 22px ui-monospace, Menlo, monospace; letter-spacing: .15em; text-transform: uppercase; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .status { display: flex; gap: 6px; flex-wrap: wrap; }
  .status button { flex: 1; padding: 8px 4px; border-radius: 8px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; }
  .status button.on[data-s="sure"] { border-color: var(--sure); background: #e3f3ea; }
  .status button.on[data-s="unsure"] { border-color: var(--unsure); background: #fbf0d6; }
  .status button.on[data-s="trying"] { border-color: var(--trying); background: #e6eaf8; }
  .ideas { list-style: none; padding: 0; margin: 0; }
  .ideas li { display: flex; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid #f0e9df; }
  .ideas li .t { flex: 1; font-family: ui-monospace, Menlo, monospace; }
  .ideas li .t small { font-family: -apple-system, sans-serif; color: var(--muted); margin-left: 6px; }
  .ideas li.no .t span { text-decoration: line-through; color: var(--muted); }
  .ideas li button { border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); padding: 2px 4px; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; padding: 7px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
  .row button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  .tools { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; }
  .feed { list-style: none; padding: 0; margin: 8px 0 0; }
  .feed li { padding: 7px 0; border-bottom: 1px solid #f0e9df; cursor: pointer; font-size: 14px; }
  .feed li:hover { background: #f5eee4; }
  .feed .when { color: var(--muted); font-size: 12px; }
  #modal { position: fixed; inset: 0; background: rgba(43,36,32,.45); display: none; align-items: center; justify-content: center; z-index: 20; }
  #modal .box { background: var(--panel); border-radius: 14px; padding: 22px; width: min(380px, 92vw); }
  #modal h3 { margin: 0 0 6px; }
  #modal input { width: 100%; font-size: 17px; padding: 9px; border: 1px solid var(--line); border-radius: 8px; margin: 4px 0 10px; }
  #modal button { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; margin-top: 4px; }
  #modal button.alt { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  #modalMsg { color: var(--accent); font-size: 14px; min-height: 1em; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .col { max-height: 45vh; border-right: none; border-bottom: 1px solid var(--line); }
    #detail { order: -1; }
    #detail.closed { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>🦃 Turkey Crossword</h1>
  <input id="q" placeholder='Jump: "4d", "57 across", or search words…' autocomplete="off">
  <div class="chips" id="filters">
    <span class="chip on" data-f="all">All</span>
    <span class="chip" data-f="open">Not done</span>
    <span class="chip" data-f="trying">Working on</span>
    <span class="chip" data-f="unsure">Unsure</span>
    <span class="chip" data-f="sure">Confident ✓</span>
    <span class="chip" data-f="mine">Mine</span>
    <span class="chip" data-f="ocr">Check photo</span>
    <select id="askF" title="Clues where someone thinks this person might know"><option value="">🙋 Ask: anyone</option><option>Mom</option><option>Dad</option><option>Tracey</option><option>Andy</option><option>Brian</option><option>Michael</option></select>
  </div>
  <div class="bar2">
    <div id="stats"></div>
    <div id="who"></div>
  </div>
</header>
<main>
  <div class="col"><h2>ACROSS</h2><div id="listA"></div></div>
  <div class="col"><h2>DOWN</h2><div id="listD"></div></div>
  <div id="detail"></div>
</main>
<div id="modal"><div class="box">
  <h3>🦃 Join the family crossword</h3>
  <p class="hint">Use the family word everyone was given, plus your own name so we know who filled in what.</p>
  <input id="mWord" placeholder="family word" autocapitalize="off" autocomplete="off">
  <input id="mName" placeholder="your name (e.g. Mom)" autocomplete="off">
  <div id="modalMsg"></div>
  <button id="mGo">Join</button>
  <button id="mNew" class="alt" style="display:none">Start a new board with this word</button>
</div></div>

const LS = "turkeyCrossword2026.";
const PEOPLE = ["Mom", "Dad", "Tracey", "Andy", "Brian", "Michael"];

// ---------- storage: Firebase when configured, else this browser only ----------
let board = { clues: {}, log: {} };
let me = localStorage.getItem(LS + "name") || "";

let store;

async function firebaseStore() {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js");
  const fb = await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js");
  const db = fb.getDatabase(initializeApp(FIREBASE_CONFIG));
  const r = p => fb.ref(db, `boards/${word}/${p}`);
  return {
    live: true,
    exists: async () => (await fb.get(r("meta"))).exists(),
    create: () => fb.set(r("meta"), { createdBy: me, createdAt: Date.now() }),
    subscribe(onChange, onConn) {
      fb.onValue(r("clues"), s => { board.clues = s.val() || {}; onChange(); });
      fb.onValue(fb.query(r("log"), fb.limitToLast(150)), s => { board.log = s.val() || {}; onChange("log"); });
      fb.onValue(fb.ref(db, ".info/connected"), s => onConn(!!s.val()));
    },
    patchClue: (id, p) => fb.update(r(`clues/${id}`), p),
    setAsk: (id, who, on) => fb.set(r(`clues/${id}/ask/${who}`), on ? true : null),
    addIdea: (id, it) => fb.set(fb.push(r(`clues/${id}/ideas`)), it),
    patchIdea: (id, k, p) => fb.update(r(`clues/${id}/ideas/${k}`), p),
    delIdea: (id, k) => fb.remove(r(`clues/${id}/ideas/${k}`)),
    log: e => fb.set(fb.push(r("log")), e),
  };
}

function localStore() {
  const key = () => LS + "board." + word;
  const load = () => { board = JSON.parse(localStorage.getItem(key()) || '{"clues":{},"log":{}}'); };
  let cb = () => {};
  const commit = () => { localStorage.setItem(key(), JSON.stringify(board)); cb(); };
  const c = id => (board.clues[id] = board.clues[id] || {});
  const k = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return {
    live: false,
    exists: async () => true, create: async () => {},
    subscribe(onChange, onConn) { load(); cb = onChange; onConn(false); onChange(); },
    patchClue: async (id, p) => { Object.assign(c(id), p); commit(); },
    setAsk: async (id, who, on) => { const a = (c(id).ask = c(id).ask || {}); if (on) a[who] = true; else delete a[who]; commit(); },
    addIdea: async (id, it) => { (c(id).ideas = c(id).ideas || {})[k()] = it; commit(); },
    patchIdea: async (id, kk, p) => { Object.assign(c(id).ideas[kk], p); commit(); },
    delIdea: async (id, kk) => { delete c(id).ideas[kk]; commit(); },
    log: async e => { board.log[k()] = e; commit(); },
  };
}

// ---------- helpers ----------
let filter = "all", selected = null, view = "help";

const cl = id => board.clues[id] || {};
const label = id => id.replace("A", " Across").replace("D", " Down");

const ago = t => { if (!t) return ""; const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const d = new Date(t); return d.toLocaleDateString([], { weekday: "short" }) + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
const STATUS = { sure: "✓ confident", unsure: "? unsure", trying: "✎ working on", "": "cleared" };
const stamp = () => ({ by: me, at: Date.now() });
const askers = s => PEOPLE.filter(p => (s.ask || {})[p]);

// ---------- grid: lengths + crossing letters ----------
const ENTRIES = GRID ? GRID.entries : {};
const CELL_IDS = {};                       // "r,c" -> [ids through that cell]
for (const [id, cells] of Object.entries(ENTRIES)) for (const [r, c] of cells) (CELL_IDS[r + "," + c] = CELL_IDS[r + "," + c] || []).push(id);
const lenOf = id => (ENTRIES[id] || []).length;
// answer text -> one char per square ("" = blank); spaces/hyphens ignored, ? _ . = unknown square
const letters = ans => [...String(ans || "").toUpperCase().replace(/[\s\-']/g, "")].map(ch => /[A-Z0-9]/.test(ch) ? ch : "");
function pattern(id) {                     // per square: own letter, crossing letter(s), crossing clue id
  return (ENTRIES[id] || []).map(([r, c], i) => {
    const own = letters(cl(id).ans)[i] || "";
    const crossId = (CELL_IDS[r + "," + c] || []).find(x => x !== id) || null;
    let cross = "";
    if (crossId) { const k = ENTRIES[crossId].findIndex(([a, b]) => a === r && b === c); cross = letters(cl(crossId).ans)[k] || ""; }
    return { own, cross, crossId, clash: own && cross && own !== cross };
  });
}
const touched = id => { const c = cl(id); return c.by === me || Object.values(c.ideas || {}).some(i => i.by === me); };

const logTimers = {};
function logLater(id, key, what, delay = 2500) {   // collapse rapid typing into one feed entry
  clearTimeout(logTimers[id + key]);
  logTimers[id + key] = setTimeout(() => store.log({ ...stamp(), id, what: what().slice(0, 200) }), delay);
}

function parseJump(q) {
  const m = q.trim().toLowerCase().match(/^(\d+)\s*-?\s*(a|across|d|down)?$/);
  return m ? { num: +m[1], dir: m[2] ? m[2][0].toUpperCase() : null } : null;
}

function matches(c) {
  const s = cl(idOf(c));
  if (filter === "open" && s.status === "sure") return false;
  if (["trying", "unsure", "sure"].includes(filter) && s.status !== filter) return false;
  if (filter === "mine" && !touched(idOf(c))) return false;
  if (filter === "ocr" && !c.ocrFlag) return false;
  const askF = document.getElementById("askF").value;
  if (askF && !(s.ask || {})[askF]) return false;
  const q = document.getElementById("q").value.trim().toLowerCase();
  if (!q) return true;
  const j = parseJump(q);
  if (j) return c.num === j.num && (!j.dir || c.dir === j.dir);
  return [c.clue, s.ans, s.notes, ...Object.values(s.ideas || {}).map(i => i.t)].join(" ").toLowerCase().includes(q);
}

// ---------- rendering ----------
let lastSeen = {};
function listPat(id) {
  if (!lenOf(id)) return "";
  const p = pattern(id);
  return p.some(x => x.cross) ? `<span class="pat">${p.map(x => x.cross || "_").join("")}</span>` : "";
}
function renderLists() {
  for (const dir of ["A", "D"]) {
    document.getElementById("list" + dir).innerHTML = CLUES.filter(c => c.dir === dir && matches(c)).map(c => {

      const changed = lastSeen[id] && s.at && s.at !== lastSeen[id] && s.by !== me;
      return `<div class="clue ${selected === id ? "sel" : ""} ${changed ? "flash" : ""}" data-id="${id}">

        <span>${esc(c.clue)}${lenOf(id) ? `<span class="len">(${lenOf(id)})</span>` : ""}${c.ocrFlag ? '<span class="ocr" title="Photo was hard to read — double-check against the paper">check</span>' : ""}
        ${s.ans ? `<span class="ans">${esc(s.ans)}<span class="by">${esc(s.by)}</span></span>` : listPat(id)}${askers(s).length ? `<span class="askline">🙋 ${askers(s).join(" · ")}</span>` : ""}</span></div>`;
    }).join("");
  }
  lastSeen = Object.fromEntries(Object.entries(board.clues).map(([k, v]) => [k, v.at]));
  const n = CLUES.length, vals = CLUES.map(c => cl(idOf(c)).status);

}

    <label>HOW SURE ARE WE?</label>
    <div class="status">
      <button data-s="sure">✓ Confident</button><button data-s="unsure">? Unsure</button>
      <button data-s="trying">✎ Working on</button><button data-s="">Clear</button>
    </div>
    <details class="ask" ${askOpen ? "open" : ""}><summary>WHO MIGHT KNOW? ${askers(s).length ? "<b>" + askers(s).join(", ") + "</b>" : ""}</summary>
      <div class="askbtns">${PEOPLE.map(p => `<button data-p="${p}" class="${(s.ask || {})[p] ? "on" : ""}">${p}</button>`).join("")}</div>
    </details>
    <label>IDEAS / THINGS WE'VE TRIED</label>
    <div class="row"><input id="ideaIn" placeholder="add an idea, press Enter" value="${esc(ideaDraft)}"><button id="ideaAdd">Add</button></div>
    <ul class="ideas">${ideas.map(([k, it]) => `<li class="${it.no ? "no" : ""}">
      <span class="t"><span>${esc(it.t)}</span><small>${esc(it.by || "")}</small></span>
      <button data-a="use" data-k="${k}" title="Put this in the answer box">⤴ use</button>
      <button data-a="no" data-k="${k}" title="Tried it — doesn't fit">${it.no ? "↺ undo" : "✗ nope"}</button>
      <button data-a="del" data-k="${k}" title="Delete">🗑</button></li>`).join("")}</ul>
    <label>NOTES</label>
    <textarea id="notes" placeholder="crossing letters, hunches…">${esc(notesVal)}</textarea>
    <div class="tools"><button id="prev">← prev</button><button id="next">next →</button></div>`;
  wireClose();
  d.querySelector(".boxes")?.addEventListener("click", e => { const b = e.target.closest(".box"); if (b && b.dataset.x) select(b.dataset.x); });
  d.querySelector(".askbtns").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const who = b.dataset.p, on = !(cl(id).ask || {})[who];
    store.setAsk(id, who, on);
    store.log({ ...stamp(), id, what: on ? `thinks ${who} might know` : `unmarked ${who}` });
  };
  d.querySelectorAll(".status button").forEach(b => {
    b.classList.toggle("on", b.dataset.s === (s.status || "") && b.dataset.s !== "");
    b.onclick = () => { store.patchClue(id, { status: b.dataset.s, ...stamp() });
      store.log({ ...stamp(), id, what: `marked ${STATUS[b.dataset.s]}${s.ans ? " (" + s.ans + ")" : ""}` }); };
  });
  const ans = d.querySelector("#ans");
  ans.oninput = () => {
    const v = ans.value.toUpperCase().slice(0, 40);
    store.patchClue(id, { ans: v, ...(cl(id).status ? {} : { status: v ? "trying" : "" }), ...stamp() });
    logLater(id, "ans", () => cl(id).ans ? `answer → ${cl(id).ans}` : "cleared the answer");
  };
  const notes = d.querySelector("#notes");
  notes.oninput = () => { store.patchClue(id, { notes: notes.value.slice(0, 2000), ...stamp() }); logLater(id, "notes", () => "edited notes", 4000); };
  const addIdea = () => {
    const inp = d.querySelector("#ideaIn"), t = inp.value.trim().slice(0, 60); if (!t) return;
    inp.value = "";
    store.addIdea(id, { t, no: false, ...stamp() });
    if (!cl(id).status) store.patchClue(id, { status: "trying", ...stamp() });
    store.log({ ...stamp(), id, what: `idea: ${t}` });
  };
  d.querySelector("#ideaAdd").onclick = addIdea;
  d.querySelector("#ideaIn").onkeydown = e => { if (e.key === "Enter") addIdea(); };
  d.querySelector(".ideas").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.k, it = cl(id).ideas[k];
    if (b.dataset.a === "use") {
      store.patchClue(id, { ans: it.t.toUpperCase(), status: cl(id).status || "unsure", ...stamp() });
      store.log({ ...stamp(), id, what: `answer → ${it.t.toUpperCase()}` });
    }
    if (b.dataset.a === "no") { store.patchIdea(id, k, { no: !it.no });
      store.log({ ...stamp(), id, what: `${it.no ? "un-crossed" : "crossed out"} ${it.t}` }); }
    if (b.dataset.a === "del") store.delIdea(id, k);
  };
  const same = CLUES.filter(x => x.dir === c.dir), i = same.indexOf(c);
  d.querySelector("#prev").onclick = () => i > 0 && select(idOf(same[i - 1]));
  d.querySelector("#next").onclick = () => i < same.length - 1 && select(idOf(same[i + 1]));
  if (focused) { const el = d.querySelector("#" + focused); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}

function boxesHtml(id) {
  const p = pattern(id), n = p.length, typed = letters(cl(id).ans).length;
  const clashes = p.filter(x => x.clash).length;
  return `<label>${n} LETTERS <span style="letter-spacing:0;text-transform:none">· blue = from crossing answers · tap a square to jump to its crossing clue</span></label>
    <div class="boxes">${p.map((x, i) => `<div class="box ${x.clash ? "clash" : x.own ? "mine" : x.cross ? "cross" : ""}" data-x="${x.crossId || ""}"
      title="${x.crossId ? label(x.crossId) + (x.cross ? ": " + x.cross : "") : ""}"><small>${i + 1}</small>${x.own || x.cross}</div>`).join("")}</div>
    ${typed && typed !== n ? `<div class="warn">⚠ our answer has ${typed} letters, but this one needs ${n}</div>` : ""}
    ${clashes ? `<div class="warn">⚠ ${clashes} square${clashes > 1 ? "s disagree" : " disagrees"} with a crossing answer (red)</div>` : ""}`;
}

function select(id) {
  selected = id; view = "clue";
  document.activeElement?.blur?.();
  renderDetail(); renderLists();
  document.querySelector(`.clue[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
  if (window.innerWidth <= 900) window.scrollTo({ top: 0 });   // panel sits right under the sticky header
}

// ---------- wiring ----------
document.getElementById("listA").onclick = document.getElementById("listD").onclick = e => {
  const el = e.target.closest(".clue"); if (el) select(el.dataset.id);
};
const q = document.getElementById("q");
q.oninput = renderLists;
document.getElementById("askF").onchange = renderLists;
q.onkeydown = e => {
  if (e.key !== "Enter") return;
  const j = parseJump(q.value);
  if (j) { const hit = CLUES.find(c => c.num === j.num && (!j.dir || c.dir === j.dir)); if (hit) { select(idOf(hit)); q.value = ""; renderLists(); } }
};
document.getElementById("filters").onclick = e => {
  const ch = e.target.closest(".chip"); if (!ch) return;
  filter = ch.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === ch));
  renderLists();
};
setInterval(() => { if (view === "activity" || selected) renderDetail(); }, 60000);
document.addEventListener("keydown", e => { if (e.key === "Escape" && view !== "closed") closeDetail(); });   // keep "x min ago" fresh

async function start() {
  if (!store) store = FIREBASE_CONFIG ? await firebaseStore() : localStore();
  renderWho(false);
  store.subscribe(what => { renderLists(); if (what !== "log" || view === "activity") renderDetail(); }, renderWho);
}

// ---------- join ----------
const hashWord = decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
if (hashWord && hashWord !== word) word = "";
const modal = document.getElementById("modal"), msg = document.getElementById("modalMsg");
const mWord = document.getElementById("mWord"), mName = document.getElementById("mName"), mNew = document.getElementById("mNew");
async function join(create) {
  const w = mWord.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, ""), n = mName.value.trim().slice(0, 30);
  if (w.length < 4) { msg.textContent = "The family word needs at least 4 letters."; return; }
  if (!n) { msg.textContent = "Please add your name."; return; }
  word = w; me = n;
  if (!store) store = FIREBASE_CONFIG ? await firebaseStore() : localStore();
  try {
    if (!(await store.exists())) {
      if (!create) { msg.textContent = `No board called "${w}" yet. Check the spelling, or start a new one.`; mNew.style.display = "block"; return; }
      await store.create();
    }
  } catch (err) { msg.textContent = "Couldn't reach the shared board (" + err.message + ")."; return; }
  localStorage.setItem(LS + "word", word); localStorage.setItem(LS + "name", me);
  modal.style.display = "none";
  start();
}
document.getElementById("mGo").onclick = () => join(false);
mNew.onclick = () => join(true);
[mWord, mName].forEach(el => el.onkeydown = e => { if (e.key === "Enter") join(false); });
renderLists(); renderDetail();
if (word && me) start();
else { mWord.value = hashWord || word; mName.value = me; modal.style.display = "flex"; (mWord.value ? mName : mWord).focus(); }
</script>
</body>
</html>
